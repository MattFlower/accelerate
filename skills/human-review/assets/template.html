<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; base-uri 'none'; form-action 'none'">
<!-- The page never loads anything from the network; the policy above enforces that even for agent-written HTML. -->
<meta name="generator" content="human-review">
<title>%TITLE%</title>
<style>/*%FONT_FACE%*/
/*%CSS%*/</style>
<script>try{var t=localStorage.getItem("hr:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<noscript><p style="padding:24px;font:16px system-ui">This review needs JavaScript to render.</p></noscript>
<div id="app" aria-busy="true"></div>
<script type="application/json" id="hr-data">%DATA%</script>
<script>/*%VENDOR%*/</script>
<script>/*%APP%*/</script>
</body>
</html>
